<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1340" viewBox="0 0 1520 1340" role="img" aria-labelledby="title desc">
<title id="title">Programmable CPU selection for native RFS</title>
<desc id="desc">The userspace loader publishes a complete BPF policy through a per-device struct_ops link. The receive path obtains native application and active CPU hints, optionally invokes BPF, validates the desired CPU, and retains native migration checks and backlog accounting. An inactive link after device unregister is retained until released.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
</defs>
<style>
  text { font-family: "DejaVu Sans", sans-serif; fill: #172b4d; }
  .title { font-size: 32px; font-weight: 700; }
  .subtitle { font-size: 18px; fill: #52637a; }
  .section { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; }
  .box-title { font-size: 20px; font-weight: 700; }
  .body { font-size: 17px; fill: #3f526b; }
  .label { font-size: 14px; font-weight: 600; fill: #53677f; }
  .footer { font-size: 17px; fill: #3f526b; }
</style>
<rect width="1520" height="1340" fill="#ffffff"/>

<text x="56" y="58" class="title" text-anchor="start">Programmable CPU selection for native RFS</text>
<text x="56" y="94" class="subtitle" text-anchor="start">BPF proposes a desired CPU. Native RFS decides when it can become active.</text>
