<text x="84" y="212" class="box-title" text-anchor="start">Topology + policy</text>
<text x="84" y="241" class="body" text-anchor="start">sysfs topology / CPU pool / SMT</text>
<text x="84" y="265" class="body" text-anchor="start">process / cluster / NUMA</text>
<rect x="480" y="180" width="384" height="104" rx="16" fill="#ffffff" stroke="#76a8f7" stroke-width="1.5"/>
<text x="500" y="212" class="box-title" text-anchor="start">rfs_policy userspace loader</text>
<text x="500" y="241" class="body" text-anchor="start">load program → fill maps → freeze</text>
<text x="500" y="265" class="body" text-anchor="start">attach / update with expected-old map</text>
<rect x="928" y="180" width="500" height="104" rx="16" fill="#ffffff" stroke="#76a8f7" stroke-width="1.5"/>
<text x="948" y="212" class="box-title" text-anchor="start">BPF struct_ops link</text>
<text x="948" y="241" class="body" text-anchor="start">One policy per netdevice; pin the link</text>
<text x="948" y="265" class="body" text-anchor="start">Publish dev-&gt;bpf_rfs_ops with RTNL + RCU</text>
<rect x="64" y="420" width="292" height="80" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="84" y="452" class="box-title" text-anchor="start">Application socket I/O</text>
<text x="84" y="481" class="body" text-anchor="start">Application runs on CPU A</text>
<rect x="64" y="550" width="292" height="104" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="84" y="582" class="box-title" text-anchor="start">Global RFS hint table</text>
<text x="84" y="611" class="body" text-anchor="start">Original app_cpu_hint</text>
<text x="84" y="635" class="body" text-anchor="start">Hash-based, advisory record</text>
<rect x="64" y="785" width="292" height="104" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="84" y="817" class="box-title" text-anchor="start">RX queue flow slot</text>
<text x="84" y="846" class="body" text-anchor="start">active_cpu</text>
<text x="84" y="870" class="body" text-anchor="start">last_qtail</text>
<rect x="64" y="1015" width="292" height="90" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="84" y="1047" class="box-title" text-anchor="start">Per-CPU backlog state</text>
<text x="84" y="1076" class="body" text-anchor="start">Real queue head / tail</text>
<rect x="480" y="410" width="370" height="100" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="500" y="442" class="box-title" text-anchor="start">Native RFS lookup</text>
<text x="500" y="471" class="body" text-anchor="start">get_rps_cpu(): hash / table match</text>
<text x="500" y="495" class="body" text-anchor="start">Read app hint and active RX slot</text>
<rect x="950" y="410" width="450" height="100" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="970" y="442" class="box-title" text-anchor="start">Existing RPS / local fallback</text>
<text x="970" y="471" class="body" text-anchor="start">RFS miss or native tables unavailable</text>
<text x="970" y="495" class="body" text-anchor="start">No policy callback for this lookup</text>
<rect x="480" y="585" width="370" height="105" rx="16" fill="#eafaf6" stroke="#16a085" stroke-width="1.5"/>
<text x="500" y="617" class="box-title" text-anchor="start">Optional BPF select_cpu(ctx)</text>
<text x="500" y="646" class="body" text-anchor="start">Read-only context + frozen maps</text>
<text x="500" y="670" class="body" text-anchor="start">No binding → preserve native hint</text>
<rect x="480" y="785" width="370" height="104" rx="16" fill="#f0f7ff" stroke="#609bec" stroke-width="1.5"/>
<text x="500" y="817" class="box-title" text-anchor="start">Kernel result validation</text>
<text x="500" y="846" class="body" text-anchor="start">Range / possible / online checks</text>
<text x="500" y="870" class="body" text-anchor="start">DEFAULT or invalid → app CPU hint</text>
<rect x="920" y="765" width="480" height="175" rx="16" fill="#fff5e7" stroke="#e99a31" stroke-width="1.5"/>
<text x="940" y="797" class="box-title" text-anchor="start">Native migration guard</text>
<text x="940" y="826" class="body" text-anchor="start">Desired CPU differs from the active CPU:</text>
<text x="940" y="850" class="body" text-anchor="start">old CPU unset, offline, or backlog drained</text>
<text x="940" y="874" class="body" text-anchor="start">→ set_rps_cpu(); otherwise retain active CPU</text>
<text x="940" y="898" class="body" text-anchor="start">Keep final native CPU availability checks</text>
<rect x="920" y="1010" width="480" height="120" rx="16" fill="#ffffff" stroke="#aab8ca" stroke-width="1.5"/>
<text x="940" y="1042" class="box-title" text-anchor="start">Native receive / protocol processing</text>
<text x="940" y="1071" class="body" text-anchor="start">enqueue_to_backlog() when a CPU is selected</text>
<text x="940" y="1095" class="body" text-anchor="start">process_backlog() or existing local receive</text>
<text x="940" y="1119" class="body" text-anchor="start">Queue ownership and progress stay native</text>
<rect x="40" y="1172" width="1440" height="126" rx="16" fill="#f8fafc" stroke="#dce4ee" stroke-width="1.5"/>
<text x="64" y="1204" class="section" text-anchor="start">LIFETIME AND SEMANTICS</text>
<text x="64" y="1235" class="footer" text-anchor="start">Update / detach: unpublish or replace under RTNL, then wait for RCU readers before releasing old policy resources.</text>
<text x="64" y="1264" class="footer" text-anchor="start">NETDEV_UNREGISTER: deactivate binding; keep link / map until user release; later updates return ENODEV.</text>
<text x="56" y="1325" class="label" text-anchor="start">Solid: execution  |  Dashed: configuration / state access  |  Native RFS may defer a policy proposal.</text>
</svg>
